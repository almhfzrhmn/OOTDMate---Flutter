<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - OOTDMate</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #0C0C0C;
    --glass: rgba(26, 26, 26, 0.7);
    --primary: #F2613F;
    --brown-deep: #481E14;
}

* {
    box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', sans-serif;
    margin: 0;
    padding: 0;
}

body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

/* 🔥 PHONE CONTAINER */
.phone {
    width: 375px;
    height: 780px;
    background: var(--bg);
    border-radius: 45px;
    overflow: hidden;
    position: relative;
    border: 2px solid #222;
}

/* 🔥 GLOW */
.phone::before {
    content: '';
    position: absolute;
    top: -100px;
    right: -100px;
    width: 300px;
    height: 300px;
    background: var(--brown-deep);
    filter: blur(90px);
    border-radius: 50%;
    opacity: 0.5;
}

/* 🔥 SCREEN */
.screen {
    padding: 25px;
    height: 100%;
    display: flex;
    flex-direction: column;
    color: white;
    position: relative;
    z-index: 2;
}

/* 🔥 HEADER */
.title {
    font-size: 32px;
    font-weight: 800;
    line-height: 1.2;
}

.subtitle {
    color: #888;
    margin-top: 8px;
    margin-bottom: 25px;
}

/* 🔥 GLASS FORM */
.form-card {
    background: var(--glass);
    backdrop-filter: blur(15px);
    border-radius: 25px;
    padding: 20px;
    border: 1px solid rgba(255,255,255,0.05);
}

/* 🔥 INPUT */
.input-group {
    margin-bottom: 15px;
}

.input-group input {
    width: 100%;
    padding: 14px;
    border-radius: 15px;
    border: none;
    outline: none;
    background: rgba(255,255,255,0.05);
    color: white;
    font-size: 14px;
}

.input-group input::placeholder {
    color: #777;
}

/* 🔥 CHECKBOX */
.agree {
    display: flex;
    align-items: center;
    font-size: 13px;
    color: #aaa;
    margin-top: 10px;
}

.agree input {
    margin-right: 8px;
    accent-color: var(--primary);
}

/* 🔥 BUTTON */
.btn {
    margin-top: 20px;
    width: 100%;
    padding: 16px;
    border-radius: 18px;
    border: none;
    background: var(--primary);
    color: white;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(242, 97, 63, 0.3);
    transition: 0.3s;
}

.btn:hover {
    transform: translateY(-2px);
}

/* 🔥 FOOTER */
.footer {
    margin-top: 15px;
    text-align: center;
    font-size: 13px;
    color: #777;
}

.footer span {
    color: var(--primary);
    cursor: pointer;
}

</style>
</head>

<body>

<div class="phone">
    <div class="screen">

        <div>
            <div class="title">
                Create <br>
                <span style="color: var(--primary)">Account</span>
            </div>
            <div class="subtitle">
                Join OOTDMate and elevate your style.
            </div>
        </div>

        <div class="form-card">

            <div class="input-group">
                <input type="text" placeholder="Full Name">
            </div>

            <div class="input-group">
                <input type="text" placeholder="Username">
            </div>

            <div class="input-group">
                <input type="email" placeholder="Email">
            </div>

            <div class="input-group">
                <input type="password" placeholder="Password">
            </div>

            <div class="input-group">
                <input type="password" placeholder="Confirm Password">
            </div>

            <div class="agree">
                <input type="checkbox">
                <label>I agree to Terms & Conditions</label>
            </div>

            <button class="btn">Register</button>

            <div class="footer">
                Already have an account? <span>Login</span>
            </div>

        </div>

    </div>
</div>

</body>
</html>
